<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>storycanvas — video frame</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; font-synthesis: none; --ink: #272823; --paper: #f1ebdd; --mauve: #7c7380; --blue: #527fc1; }
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
    /* Best Internet brand guidelines v0.1: p5 palette, p7 twin rules,
       p8–9 restrained halftone/diagram fragments. Decoration stays outside recorded UI. */
    body { background: var(--paper); color: var(--ink); }
    button { font: inherit; }
    .desktop { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
    .desktop::before { content: ""; position: absolute; width: 210px; height: 310px; left: -125px; bottom: -78px; border-radius: 50%; transform: rotate(-27deg); background: radial-gradient(#272823 1.1px, transparent 1.45px) 0 0 / 4px 4px; mask-image: linear-gradient(55deg, #000, #0008 50%, #0000 90%); opacity: .48; }
    .desktop::after { content: ""; position: absolute; left: 80px; right: 80px; top: 78px; height: 4px; border-block: 1px solid #27282365; }
    .orbit { position: absolute; width: 460px; height: 360px; right: -353px; top: 332px; transform: rotate(-30deg); border: 1px solid #27282360; border-radius: 50%; background: repeating-linear-gradient(0deg, transparent 0 7px, #27282314 7px 8px); box-shadow: 0 0 0 16px #f1ebdd, 0 0 0 17px #27282335; }
    .scene-meta { position: absolute; top: 33px; left: 82px; right: 82px; height: 31px; display: flex; align-items: center; justify-content: space-between; font-size: 19px; letter-spacing: -.25px; }
    .caption { display: flex; align-items: center; gap: 11px; font-weight: 550; }
    .caption::before { content: ""; width: 8px; height: 8px; background: var(--ink); border-radius: 1px; }
    .scene-state { display: flex; align-items: center; gap: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #746e67; letter-spacing: .04em; }
    .scene-state i { width: 6px; height: 6px; background: #8c867d; border-radius: 50%; }
    body[data-mode="library"] .scene-state i { background: var(--blue); }
    .browser { position: absolute; left: 78px; top: 100px; width: 1764px; height: 942px; border: 2px solid #68616a; border-radius: 15px 15px 11px 11px; background: #fff; box-shadow: 0 15px 0 -9px #27282313, 0 23px 48px #27282329; overflow: hidden; }
    .tabs { height: 34px; display: flex; align-items: flex-end; padding: 0 16px; gap: 8px; background: var(--mauve); }
    .traffic { align-self: center; display: flex; align-items: center; gap: 9px; padding-right: 23px; }
    .traffic span { width: 13px; height: 13px; border-radius: 50%; background: #e58170; box-shadow: inset 0 0 0 1px #0000001a; }
    .traffic span:nth-child(2) { background: #e7bd65; }
    .traffic span:nth-child(3) { background: #83ad8c; }
    .tab { display: flex; align-items: center; gap: 10px; height: 30px; width: 290px; padding: 0 13px; border-radius: 10px 10px 0 0; color: #f1ebdd; font-size: 13px; white-space: nowrap; }
    .tab.active { background: #e7e0d4; color: var(--ink); }
    .tab:not(.active) { width: 213px; opacity: .72; }
    .tab:not(.active)::after { content: ""; height: 18px; width: 1px; background: #f1ebdd34; margin-left: auto; }
    .tab-logo { display: inline-grid; place-items: center; width: 17px; height: 20px; border-radius: 3px; color: white; background: #e65c87; font-size: 15px; font-weight: 800; }
    .tab-logo.other { background: transparent; color: #f1ebdd; font-size: 20px; font-weight: 400; }
    .tab-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .close-tab { font-size: 19px; color: #7c7380; font-weight: 300; margin-left: 12px; }
    .new-tab { width: 30px; align-self: center; text-align: center; color: #f1ebdd; font-size: 23px; font-weight: 300; }
    .window-mark { margin-left: auto; align-self: center; color: #f1ebdd; width: 22px; }
    .toolbar { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #e7e0d4; border-bottom: 1px solid #c7bfb3; }
    .nav-icons { display: flex; gap: 17px; align-items: center; flex: none; color: #6d6669; }
    .nav-icons svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.55; fill: none; }
    .nav-icons .forward { opacity: .42; }
    .address { flex: 1; height: 31px; display: flex; align-items: center; gap: 11px; border-radius: 17px; background: #faf8f0; border: 1px solid #d4ccc0; padding: 0 13px; margin-left: 4px; min-width: 0; }
    .address svg { width: 15px; height: 15px; flex: none; fill: none; stroke: #6d6669; stroke-width: 1.5; }
    .url { color: #787269; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .url strong { font-weight: 500; color: #3d3d36; }
    .bookmark { margin-left: auto; color: #726b6c; }
    .extension { display: flex; align-items: center; gap: 8px; height: 32px; flex: none; padding: 0 11px; border: 1px solid #b1a5af; border-radius: 7px; background: #faf8f0; color: #5e555f; font-size: 12px; font-weight: 600; }
    .extension img { width: 20px; height: 20px; }
    .extension-state { font-size: 9px; line-height: 16px; letter-spacing: .05em; border-radius: 3px; background: #e8e0d6; padding: 0 4px; color: #726a6e; }
    body[data-mode="library"] .extension { background: var(--blue); color: #fff; border-color: var(--blue); }
    body[data-mode="library"] .extension-state { color: #e0f1ff; background: #ffffff24; }
    body[data-popup="true"] .extension { box-shadow: 0 0 0 3px #527fc155; }
    .puzzle, .more { width: 22px; height: 22px; stroke: #726b6c; fill: none; stroke-width: 1.55; flex: none; }
    .avatar { width: 25px; height: 25px; background: #8b8290; color: #fff; border-radius: 50%; display: grid; place-items: center; font-size: 12px; flex: none; }
    .viewport { position: relative; width: 1760px; height: 860px; background: #fff; }
    .viewport img { display: block; width: 100%; height: 100%; object-fit: fill; }
    .viewport img:not([src]), .viewport img[src=""] { display: none; }
  </style>
</head>
<body data-mode="storybook" data-popup="false">
  <div class="desktop" aria-hidden="true"><i class="orbit"></i></div>
  <div class="scene-meta"><div class="caption" id="caption">Storybook → storycanvas</div><div class="scene-state"><i></i><span id="mode-label">STORYBOOK</span></div></div>
  <main class="browser" aria-label="Browser demonstration frame">
    <div class="tabs">
      <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="tab active"><span class="tab-logo">S</span><span class="tab-name" id="tab-name">Spectrum Web Components · Storybook</span><span class="close-tab">×</span></div>
      <div class="tab"><span class="tab-logo other">⊕</span><span class="tab-name">New Tab</span></div><span class="new-tab">+</span>
      <svg class="window-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M15 5v14"/></svg>
    </div>
    <div class="toolbar">
      <div class="nav-icons" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m10 4-6 6 6 6M4 10h12"/></svg><svg class="forward" viewBox="0 0 20 20"><path d="m10 4 6 6-6 6M4 10h12"/></svg><svg viewBox="0 0 20 20"><path d="M16 8a6 6 0 1 0 0 5M16 3v5h-5"/></svg></div>
      <div class="address"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 14h12"/><circle cx="8" cy="6" r="2.2" fill="#faf8f0"/><circle cx="13" cy="14" r="2.2" fill="#faf8f0"/></svg><span class="url" id="url"><strong>opensource.adobe.com</strong>/spectrum-web-components/storybook/</span><svg class="bookmark" viewBox="0 0 20 20"><path d="m10 2 2.4 5 5.6.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9L7.6 7Z"/></svg></div>
      <button class="extension" id="extension" aria-label="storycanvas extension"><img src="../dist/icons/icon48.png" alt=""><span>storycanvas</span><span class="extension-state" id="extension-state">OFF</span></button>
      <svg class="puzzle" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4V3a3 3 0 0 1 6 0v1h5v5h1a3 3 0 0 1 0 6h-1v5h-5v-1a3 3 0 0 0-6 0v1H4v-5h1a3 3 0 0 0 0-6H4V4Z" transform="translate(1 2) scale(.8)"/></svg>
      <span class="avatar">T</span><svg class="more" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </div>
    <section class="viewport" id="viewport" aria-label="Actual recorded UI"><img id="preview" alt=""></section>
  </main>
  <script>
    const names = { spectrum: 'Spectrum Web Components', chakra: 'Chakra UI', govuk: 'GOV.UK React' };
    window.videoGeometry = Object.freeze({ width: 1920, height: 1080, x: 80, y: 180, contentWidth: 1760, contentHeight: 860, extension: { x: 1558, y: 142, width: 177, height: 32 } });
    window.setScene = function ({ source, url, mode = 'storybook', caption, popup = false, image } = {}) {
      document.body.dataset.mode = mode === 'library' ? 'library' : 'storybook';
      document.body.dataset.popup = String(Boolean(popup));
      document.getElementById('mode-label').textContent = mode === 'library' ? 'storycanvas · CHROME EXTENSION' : 'STORYBOOK';
      document.getElementById('extension-state').textContent = mode === 'library' ? 'ON' : 'OFF';
      document.getElementById('extension').setAttribute('aria-pressed', String(mode === 'library'));
      if (source) document.getElementById('tab-name').textContent = `${names[source] || source} · Storybook`;
      if (caption !== undefined) document.getElementById('caption').textContent = caption;
      if (url) {
        const address = document.getElementById('url');
        try {
          const parsed = new URL(url);
          const domain = document.createElement('strong');
          domain.textContent = parsed.host;
          address.replaceChildren(domain, document.createTextNode(parsed.pathname + parsed.search + parsed.hash));
        } catch { address.textContent = url; }
      }
      if (image !== undefined) document.getElementById('preview').src = image;
      const rect = document.getElementById('extension').getBoundingClientRect();
      return { ...window.videoGeometry, extension: { x: rect.x, y: rect.y, width: rect.width, height: rect.height } };
    };
  </script>
</body>
</html>
