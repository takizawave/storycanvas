<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture UI · Storybook</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; font-family: system-ui, sans-serif; color: #253047; }
    header { height: 56px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 22px; font-weight: 700; }
    aside { position: absolute; width: 230px; top: 56px; bottom: 0; padding: 20px; overflow: auto; border-right: 1px solid #e2e8f0; }
    aside a { display: block; text-decoration: none; color: #475569; padding: 5px 0 5px 16px; font-size: 13px; } aside strong { display: block; margin-top: 18px; font-size: 14px; }
    iframe { position: absolute; left: 230px; top: 56px; width: calc(100% - 230px); height: calc(100% - 56px); border: 0; }
  </style>
</head>
<body>
  <header>Fixture UI / Storybook</header>
  <aside aria-label="Stories"></aside>
  <iframe id="storybook-preview-iframe" title="Storybook preview"></iframe>
  <script type="module">
    import { stories } from './stories.js';
    const params = new URLSearchParams(location.search);
    const id = params.get('path')?.replace('/story/', '') || 'accordion--default';
    document.querySelector('iframe').src = `./iframe.html?id=${encodeURIComponent(id)}&viewMode=story`;
    let group;
    for (const story of stories) {
      if (group !== story.title) {
        const heading = document.createElement('strong'); heading.textContent = story.title.split('/').at(-1); document.querySelector('aside').append(heading); group = story.title;
      }
      const link = document.createElement('a'); link.href = `?path=/story/${story.id}`; link.textContent = story.name; link.dataset.itemId = story.id; document.querySelector('aside').append(link);
    }
    window.__STORYBOOK_ADDONS = { getChannel: () => ({ on() {}, emit() {} }) };
  </script>
</body>
</html>
